# Development stack — hot-reload, NOT auto-merged.
#
# This file used to be named `docker-compose.override.yml`, which Compose
# merges automatically into ANY bare `docker compose` command. That is exactly
# what caused a real outage during development: a plain `docker compose up -d
# backend` (no -f flag) silently merged this file's dev command
# (`nest start --watch`) onto the already-built PRODUCTION image (the `runner`
# stage, which has no source and no tsconfig.json) without rebuilding it. The
# container crashed on boot with "Could not find TypeScript configuration file
# tsconfig.json", and — with no restart policy — simply stayed dead.
#
# Renaming the file removes the silent-merge behavior entirely. Dev mode now
# requires an explicit second -f, which `npm run up -- --dev` passes for you:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# A bare `docker compose up` (or `restart`, `logs`, etc.) now always resolves
# to production, full stop — there is no accidental way back into this file.
#
# Differences from docker-compose.yml:
#   - Source code is bind-mounted so saves reload instantly.
#   - Backend runs `nest start --watch` instead of compiled node.
#   - Frontend runs `next dev` instead of the standalone server.
#   - Healthchecks are dropped (watch mode never reaches "healthy").
#   - Ports stay the same so the local dev experience matches prod.

services:
  backend:
    build:
      # Build only up to the `builder` stage (has full node_modules +
      # generated Prisma client + bind-mount-ready source dir).
      target: builder
    command: sh -c "npx prisma migrate deploy && npx nest start --watch"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      NODE_ENV: development
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Override the prod entrypoint by running next dev against the
    # bind-mounted source.
    build:
      # Build only up to the `builder` stage so `npx next dev` works
      # (the `runner` stage is a slim image without `next` in PATH).
      target: builder
    command: sh -c "npx next dev -p 3000 -H 0.0.0.0"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs
    environment:
      NODE_ENV: development
    depends_on:
      - backend
