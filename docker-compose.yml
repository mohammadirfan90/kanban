# Production-style compose file for the Mini Kanban stack.
# See specs/11-docker.md for design rationale.
#
# Usage:
#   cp .env.docker.example .env          # configure secrets
#   docker compose up --build            # start the full stack (production)
#   docker compose down                  # stop (keeps data)
#   docker compose down -v               # stop + delete data
#
# For hot-reload during development, see docker-compose.dev.yml. It is a
# regular compose file, NOT an auto-merged override (it used to be named
# docker-compose.override.yml, which Compose merges into every bare command).
# That auto-merge caused a real outage: a plain `docker compose up -d backend`
# silently applied the dev file's `nest start --watch` command onto the
# already-built PRODUCTION image without rebuilding it — the image has no
# source and no tsconfig.json, so the container crashed on boot and, with no
# restart policy at the time, stayed dead. Dev mode now requires explicitly
# naming both files (`npm run up -- --dev` does this for you):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# `restart: unless-stopped` below exists for the same reason: a bare
# `docker compose up` should never again leave a crashed service silently
# down with no signal.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port is configurable so a local Postgres on 5432 doesn't collide.
      # The other services reach Postgres over the compose network on 5432
      # regardless, so changing this only affects host tools (psql, Prisma CLI).
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kanban:kanban@postgres:5432/kanban
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # Run pending migrations, then start the API. `prisma migrate deploy`
    # is idempotent and safe to run on every container start.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
